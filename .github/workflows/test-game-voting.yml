name: Test separate game and main voting data
on:
  push:
    paths:
      - 'amvera-proxy/server.py'
      - 'game/**'
      - '.github/workflows/test-game-voting.yml'
  workflow_dispatch:
jobs:
  test-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          python -m py_compile amvera-proxy/server.py
          node --check game/config.js
          node --check game/simulation.js
      - name: Game API is isolated from main votes
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          import tempfile
          import threading
          import urllib.request
          from http.server import ThreadingHTTPServer

          spec = importlib.util.spec_from_file_location("voting_server", "amvera-proxy/server.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          with tempfile.TemporaryDirectory() as tmp:
              app.DB_PATH = os.path.join(tmp, "votes.db")
              app.initialize()
              server = ThreadingHTTPServer(("127.0.0.1", 0), app.VotingServer)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              root = f"http://127.0.0.1:{server.server_port}"

              def fetch(path):
                  with urllib.request.urlopen(root + path) as resp:
                      return json.load(resp)

              def submit(path, user, nominee):
                  data = json.dumps({"userId": user, "nomineeId": nominee}).encode()
                  request = urllib.request.Request(
                      root + path, data=data, headers={"Content-Type": "text/plain"}
                  )
                  with urllib.request.urlopen(request) as resp:
                      return json.load(resp)

              assert fetch("/game/api/votes")["counts"] == {}
              assert fetch("/api/votes")["counts"] == {}
              assert submit("/game/api/vote", "nb:test", 18)["counts"] == {"18": 1}
              assert fetch("/api/votes")["counts"] == {}, "Game writes leaked into main votes"
              assert submit("/api/vote", "nb:test", 1)["counts"] == {"1": 1}
              assert submit("/game/api/vote", "nb:test", 20)["counts"] == {"20": 1}
              assert fetch("/api/votes")["counts"] == {"1": 1}
              assert fetch("/game/api/votes?userId=nb:test")["selected"] == 20
              assert fetch("/api/votes?userId=nb:test")["selected"] == 1
              server.shutdown()
              server.server_close()
          print("Game and main vote storage are isolated")
          PY
