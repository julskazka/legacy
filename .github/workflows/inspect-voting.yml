name: Inspect voting client (temporary)
on:
  push:
    paths: ['.github/workflows/inspect-voting.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show voting-related client snippets
        shell: python
        run: |
          import re, html
          s=open('index.html',encoding='utf-8').read()
          print('LENGTH',len(s),'LINES',s.count('\n'))
          patterns=['NASLEDIE_VOTES_API','/api/vote','saveVote','castVote','submitForm','notibot-bridge','votes/config.js','voterId','userId','nomineeId','Проголосовать','ERR_TIMEOUT','loadVotes','voteButton']
          for pat in patterns:
            matches=list(re.finditer(re.escape(pat),s,re.I))
            print('\n===== PATTERN',pat,'COUNT',len(matches),'OFFSETS',[m.start() for m in matches[-15:]])
            for m in matches[-5:]:
              start=max(0,m.start()-900);end=min(len(s),m.end()+1500)
              excerpt=s[start:end]
              excerpt=re.sub(r'data:image/[^\s\'\"]{50,}','[DATA_IMAGE]',excerpt)
              print('EXCERPT',m.start(),excerpt[:2600])
          for m in re.finditer(r'<script\b[^>]*>',s,re.I):
            print('SCRIPT_TAG',m.start(),m.group()[:450])
