name: Refresh voting script cache key (one time)
on:
  push:
    paths: ['.github/workflows/refresh-voting-script.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make Notibot load the repaired client script
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          source=path.read_text(encoding='utf-8')
          old='./votes/config.js?v=20261115-nov21-fix'
          new='./votes/config.js?v=20261115-embedded-transport'
          assert source.count(old)==1, 'Unexpected config.js reference count'
          path.write_text(source.replace(old,new),encoding='utf-8')
          print('Updated reference:',new)
      - name: Commit only this cache-key change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Refresh Notibot vote transport script version"
          git push
