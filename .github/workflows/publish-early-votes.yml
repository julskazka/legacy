name: Publish early vote loading (one time)
on:
  push:
    paths: ['.github/workflows/publish-early-votes.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start shared totals request immediately
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          source=path.read_text(encoding='utf-8')
          early="""<title>НАСЛЕДИЕ XXI века — голосование</title><link rel="preconnect" href="https://nasledie-voting.gogina-jul.workers.dev" crossorigin><script>
window.__nasledieVotesPromise=fetch('https://nasledie-voting.gogina-jul.workers.dev/api/votes?userId=&fresh='+Date.now(),{cache:'no-store'})
 .then(function(r){return r.ok?r.json():null}).catch(function(){return null});
</script>"""
          replacements=[
            ("<title>НАСЛЕДИЕ XXI века — голосование</title>",early),
            ("let counts={}; let totalsLoaded=false; let notibotUserId=null; let voteReady=false;","let counts={}; let totalsLoaded=false; let notibotUserId=null; let voteReady=false;\nwindow.__nasledieVotesPromise?.then(result=>{if(result?.ok&&result.counts){counts=result.counts;totalsLoaded=true;render();}});"),
            ("VOTES_API_URL+'/api/votes?userId='+encodeURIComponent(notibotUserId||''),","VOTES_API_URL+'/api/votes?userId='+encodeURIComponent(notibotUserId||'')+'&fresh='+Date.now(),"),
            ("./votes/config.js?v=20261115-confirmed-loading","./votes/config.js?v=20261115-early-shared")
          ]
          for old,new in replacements:
            assert source.count(old)==1, f'Unexpected match count: {old[:80]!r} -> {source.count(old)}'
            source=source.replace(old,new)
          path.write_text(source,encoding='utf-8')
          Path('.github/workflows/publish-early-votes.yml').unlink()
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/publish-early-votes.yml
          git diff --cached --check
          git commit -m "Load shared vote totals before page assets"
          git push
