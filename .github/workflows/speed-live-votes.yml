name: Speed up live vote refresh (one time)
on:
  push:
    paths: ['.github/workflows/speed-live-votes.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh results every three seconds
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          source=path.read_text(encoding='utf-8')
          old_interval='setInterval(refreshTotals,45000)'
          new_interval='setInterval(refreshTotals,3000)'
          old_script='./votes/config.js?v=20261115-instant-vote'
          new_script='./votes/config.js?v=20261115-live-3s'
          assert source.count(old_interval)==1, 'Unexpected refresh interval count'
          assert source.count(old_script)==1, 'Unexpected config reference count'
          source=source.replace(old_interval,new_interval).replace(old_script,new_script)
          path.write_text(source,encoding='utf-8')
          Path('.github/workflows/speed-live-votes.yml').unlink()
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/speed-live-votes.yml
          git diff --cached --check
          git commit -m "Refresh live vote totals every three seconds"
          git push
